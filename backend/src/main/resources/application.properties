#spring.config.import=optional:file:.env[.properties]

spring.application.name=weather-analytics-app

#OpenWeatherMap configurations
openweather.api-key=${OPENWEATHER_API_KEY}
openweather.base-url=https://api.openweathermap.org/data/2.5
openweather.units=metric
openweather.cities-resource=classpath:data/cities.json
openweather.raw-cache-ttl=5m
openweather.processed-cache-ttl=5m
openweather.request-timeout=5s

#AUTH0 configurations
auth0.domain=${AUTH0_DOMAIN}
auth0.audience=${AUTH0_AUDIENCE}

#Allowed origins
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}